# Veilleur - Configuration Redis
# Optimisée pour le cache d'actualités

# =============================================================================
# Réseau
# =============================================================================
bind 0.0.0.0
port 6379
protected-mode no

# =============================================================================
# Persistance
# =============================================================================
# RDB snapshots
save 900 1
save 300 10
save 60 10000

# AOF (Append Only File) pour une meilleure durabilité
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"

# Répertoire de données
dir /data

# =============================================================================
# Mémoire
# =============================================================================
# Limite mémoire (ajuster selon vos besoins)
maxmemory 256mb

# Politique d'éviction : supprime les clés avec TTL les plus proches d'expirer
maxmemory-policy volatile-ttl

# =============================================================================
# Performance
# =============================================================================
# Désactiver les commandes dangereuses en production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""

# Timeout connexion (0 = pas de timeout)
timeout 0

# Keep-alive
tcp-keepalive 300

# =============================================================================
# Logging
# =============================================================================
loglevel notice
logfile ""

# =============================================================================
# Clients
# =============================================================================
maxclients 1000

# =============================================================================
# Lazy freeing (performance)
# =============================================================================
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
