# VirtualHost news.nethttp.net — reverse proxy vers Veilleur (Node, 127.0.0.1:8090)
# Installé par deploy/nethttp/installer.sh. Numéroté 015 pour primer sur 020-nethttp.net-wildcard.conf.
# TLS terminé par websec ; Apache écoute en HTTP clair sur 127.0.0.1:8443.
<VirtualHost *:8443>
    ServerName news.nethttp.net

    # --- Reverse proxy ---
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass        / http://127.0.0.1:8090/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:8090/

    # --- Anti-bot headers (politique du serveur) ---
    Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet"

    # --- Block bad user-agents ---
    RewriteEngine On
    RewriteCond %{HTTP_USER_AGENT} (nikto|sqlmap|nmap|masscan|zgrab|census|shodan|curl/|wget/|python-requests|go-http|libwww|scanner|exploit|vulnerability|attack) [NC]
    RewriteRule .* - [F,L]

    # --- Assets Vite (noms hashés) : cache 1 an ---
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # --- Compression ---
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css
        AddOutputFilterByType DEFLATE application/javascript application/json
        AddOutputFilterByType DEFLATE image/svg+xml
    </IfModule>

    # --- Logs ---
    ErrorLog  /var/log/apache2/nethttp.net/news-error.log
    CustomLog /var/log/apache2/nethttp.net/news-access.log combined
</VirtualHost>
