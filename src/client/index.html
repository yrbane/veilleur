<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Veilleur - Votre sentinelle de l'information">
  <title>Veilleur</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
  <div id="app">
    <header class="entete">
      <nav class="navigation">
        <a href="/" class="logo" data-nav>
          <span class="logo-icone icone plein" aria-hidden="true">newspaper</span>
          <span class="logo-texte">Veilleur</span>
        </a>
        <div class="nav-principale" id="nav-liens">
          <a href="/" class="nav-lien" data-nav><span class="icone" aria-hidden="true">feed</span>Fil d'actualités</a>
          <a href="/sources" class="nav-lien" data-nav><span class="icone" aria-hidden="true">rss_feed</span>Mes sources</a>
          <a href="/decouverte" class="nav-lien" data-nav><span class="icone" aria-hidden="true">explore</span>Découverte</a>
        </div>
        <div class="nav-actions" id="nav-auth">
          <!-- Contenu dynamique selon l'état d'authentification -->
        </div>
      </nav>
    </header>

    <main class="contenu-principal" id="app-contenu">
      <!-- Contenu des pages chargé dynamiquement -->
      <div class="chargement">
        <div class="la-spinner lg" role="status" aria-label="Chargement"></div>
        <p>Chargement...</p>
      </div>
    </main>

    <footer class="pied-page">
      <p>Veilleur <span id="version-app"></span> — Votre sentinelle de l'information</p>
    </footer>
  </div>

  <div id="modal-container"></div>
  <div id="toast-container" class="la-toast-region bottom-end" role="region" aria-label="Notifications"></div>

  <script type="module" src="/main.ts"></script>
</body>
</html>
